[project]
name = "browser-research-agent"
version = "0.1.0"
description = "AI-agent-driven browser research framework for web automation investigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # AI Agent
    "anthropic>=0.39.0",

    # Browser Automation
    "playwright>=1.49.0",
    "selenium>=4.27.0",

    # Proxy & Traffic Capture
    "mitmproxy>=11.0.0",

    # CDP Direct
    "pychrome>=0.2.4",

    # Anti-Detection (optional)
    "cloudscraper>=1.2.71",

    # HTTP & Parsing
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",

    # Storage
    "aiosqlite>=0.20.0",

    # CLI & Utils
    "typer>=0.14.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
bra = "browser_research_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
